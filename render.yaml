services:
  # 1. Fastify Backend API & Real-time WebSockets
  - type: web
    name: classradar-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npx -y pnpm@10 install --no-frozen-lockfile && npx -y pnpm@10 build
    startCommand: npx -y pnpm@10 prisma:migrate:deploy && npx -y pnpm@10 start
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: classradar-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: REDIS_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: ATTENDANCE_THRESHOLD
        value: "75"

  # 2. Next.js Full-Stack Web Frontend (with NVIDIA NIM Voice AI)
  - type: web
    name: classradar-web
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npx -y pnpm@10 install --no-frozen-lockfile && npx -y pnpm@10 build
    startCommand: npx -y pnpm@10 start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: classradar-api
          property: host
        transform: https://{{ . }}/api/v1
      - key: NEXT_PUBLIC_SOCKET_URL
        fromService:
          type: web
          name: classradar-api
          property: host
        transform: https://{{ . }}
      - key: NVIDIA_API_KEY
        sync: false
      - key: NEXT_PUBLIC_NVIDIA_MODEL
        value: nvidia/nemotron-3.5-lightning-30b-a3b

# 3. PostgreSQL Database
databases:
  - name: classradar-postgres
    plan: free
    databaseName: classradar
    user: classradar
