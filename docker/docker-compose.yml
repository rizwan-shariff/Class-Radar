name: classradar

services:
  postgres:
    image: postgres:16-alpine
    container_name: classradar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-classradar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-classradar_secret}
      POSTGRES_DB: ${POSTGRES_DB:-classradar_db}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-classradar} -d ${POSTGRES_DB:-classradar_db}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - classradar-net

  redis:
    image: redis:7-alpine
    container_name: classradar-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - classradar-net

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: classradar-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-classradar}:${POSTGRES_PASSWORD:-classradar_secret}@postgres:5432/${POSTGRES_DB:-classradar_db}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_classradar_production_key_2026}
    ports:
      - '3000:3000'
    networks:
      - classradar-net

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api/v1}
    container_name: classradar-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api/v1}
    ports:
      - '3001:3001'
    networks:
      - classradar-net

volumes:
  postgres_data:
  redis_data:

networks:
  classradar-net:
    driver: bridge
